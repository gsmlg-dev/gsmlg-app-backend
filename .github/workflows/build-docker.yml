name: Build Docker Image

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Docker image version'
        required: true
        default: '1.0.0'
        type: string
      target:
        description: 'Release target to build'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - backend
          - admin
          - public

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: backend
            tag_suffix: ''
            latest_suffix: ''
          - target: admin
            tag_suffix: '-admin'
            latest_suffix: '-admin'
          - target: public
            tag_suffix: '-public'
            latest_suffix: '-public'

    steps:
      - name: Check if target matches
        id: check
        run: |
          if [[ "${{ github.event.inputs.target }}" != "all" ]] && [[ "${{ github.event.inputs.target }}" != "${{ matrix.target }}" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout code
        if: steps.check.outputs.skip != 'true'
        uses: actions/checkout@v5

      - name: Set up QEMU
        if: steps.check.outputs.skip != 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: steps.check.outputs.skip != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        if: steps.check.outputs.skip != 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        if: steps.check.outputs.skip != 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          context: git
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ github.event.inputs.version }}${{ matrix.tag_suffix }}
            type=raw,value=latest${{ matrix.latest_suffix }}

      - name: Build and push Docker image
        if: steps.check.outputs.skip != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.meta.outputs.tags }}
            ${{ matrix.target == 'public' && format('{0}/{1}/gsmlg-app-public:{2}', env.REGISTRY, github.repository_owner, github.event.inputs.version) || '' }}
            ${{ matrix.target == 'public' && format('{0}/{1}/gsmlg-app-public:latest', env.REGISTRY, github.repository_owner) || '' }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            RELEASE_VERSION=${{ github.event.inputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  verify-images:
    name: Verify Published Images
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify manifests, pulls, and public startup
        env:
          IMAGE_REPOSITORY: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          PUBLIC_IMAGE_REPOSITORY: ${{ env.REGISTRY }}/${{ github.repository_owner }}/gsmlg-app-public
          RELEASE_VERSION: ${{ github.event.inputs.version }}
          RELEASE_TARGET: ${{ github.event.inputs.target }}
        run: |
          python3 .github/scripts/verify_release_images.py \
            --repository "$IMAGE_REPOSITORY" \
            --public-repository "$PUBLIC_IMAGE_REPOSITORY" \
            --version "$RELEASE_VERSION" \
            --target "$RELEASE_TARGET" \
            --source-sha "$(git rev-parse HEAD)"

  summary:
    runs-on: ubuntu-latest
    needs: [build, verify-images]
    if: always()
    steps:
      - name: Build Summary
        env:
          RELEASE_TARGET: ${{ github.event.inputs.target }}
          RELEASE_VERSION: ${{ github.event.inputs.version }}
        run: |
          {
            echo "## Docker Build Summary"
            echo ""
            echo "| Target | Tag | Build | Verification |"
            echo "|--------|-----|-------|--------------|"
            if [[ "$RELEASE_TARGET" == "all" || "$RELEASE_TARGET" == "backend" ]]; then
              echo "| backend | \`$RELEASE_VERSION\` | ${{ needs.build.result }} | ${{ needs.verify-images.result }} |"
            fi
            if [[ "$RELEASE_TARGET" == "all" || "$RELEASE_TARGET" == "admin" ]]; then
              echo "| admin | \`$RELEASE_VERSION-admin\` | ${{ needs.build.result }} | ${{ needs.verify-images.result }} |"
            fi
            if [[ "$RELEASE_TARGET" == "all" || "$RELEASE_TARGET" == "public" ]]; then
              echo "| public | \`$RELEASE_VERSION-public\` | ${{ needs.build.result }} | ${{ needs.verify-images.result }} |"
              echo "| public repository | \`${{ github.repository_owner }}/gsmlg-app-public:latest\` | ${{ needs.build.result }} | ${{ needs.verify-images.result }} |"
            fi
            echo ""
            echo "Registry: \`${{ env.REGISTRY }}/${{ github.repository }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
